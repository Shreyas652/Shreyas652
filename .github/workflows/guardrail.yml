name: Break My Guardrail

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: guardrail
  cancel-in-progress: false

jobs:
  score:
    if: startsWith(github.event.issue.title, '[guardrail]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Score bounded issue text
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          USER_LOGIN: ${{ github.event.issue.user.login }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/guardrail_issue.py

      - name: Commit leaderboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html .github/guardrail/bypasses.json
          git diff --cached --quiet || git commit -m "guardrail: record bypass from issue ${{ github.event.issue.number }}"
          git push

      - name: Reply and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file guardrail-comment.md
          gh issue close "$ISSUE_NUMBER" --reason completed
