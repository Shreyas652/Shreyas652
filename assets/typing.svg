<svg xmlns="http://www.w3.org/2000/svg" width="760" height="52" viewBox="0 0 760 52" role="img" aria-labelledby="title desc">
  <title id="title">Engineering focus</title><desc id="desc">Animated text cycles through secure retrieval and agent systems, then inference optimization and FastAPI backends.</desc>
  <style>.bg{fill:#0d1117;stroke:#30363d}.prompt{fill:#3fb950}.text{fill:#c9d1d9;font:15px ui-monospace,SFMono-Regular,Consolas,monospace}.cursor{fill:#58a6ff}.static{display:none}@media(prefers-color-scheme:light){.bg{fill:#fff;stroke:#d0d7de}.prompt{fill:#1a7f37}.text{fill:#24292f}.cursor{fill:#0969da}}@media(prefers-reduced-motion:reduce){.cycle{display:none}.static{display:inline}}</style>
  <rect class="bg" x="1" y="1" width="758" height="50" rx="10"/><text class="prompt" x="18" y="32" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">focus&gt;</text>
  <g class="cycle"><text class="text" x="82" y="32">secure retrieval and agent systems<animate attributeName="opacity" values="1;1;0;0;0;0;0;1" keyTimes="0;.20;.25;.26;.70;.74;.75;1" dur="8s" repeatCount="indefinite"/></text><text class="text" x="82" y="32" opacity="0">inference optimization and FastAPI backends<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.25;.30;.70;.75;1" dur="8s" repeatCount="indefinite"/></text><rect class="cursor" x="430" y="17" width="8" height="19"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g>
  <text class="text static" x="82" y="32">secure AI systems with explicit boundaries</text>
</svg>
