<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Now building</title>
  <desc id="desc">recent public commits</desc>
  <style>
    .bg { fill:#0d1117 } .panel { fill:#161b22; stroke:#30363d }
    .title { fill:#f0f6fc; font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace }
    .text { fill:#c9d1d9; font:13px ui-monospace,SFMono-Regular,Consolas,monospace }
    .muted { fill:#8b949e; font:12px ui-monospace,SFMono-Regular,Consolas,monospace }
    @media (prefers-color-scheme:light) {
      .bg { fill:#ffffff } .panel { fill:#f6f8fa; stroke:#d0d7de }
      .title { fill:#1f2328 } .text { fill:#24292f } .muted { fill:#57606a }
    }
  </style>
  <rect class="bg" width="760" height="240" rx="12"/>
  <rect class="panel" x="1" y="1" width="758" height="238" rx="11"/>
  <text class="title" x="20" y="30">Now building</text>
  <text class="muted" x="740" y="29" text-anchor="end">recent public commits</text>
  <text class="muted" x="20" y="72">Refresh pending — run the widget workflow.</text>
</svg>
