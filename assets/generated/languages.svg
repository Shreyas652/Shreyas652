  <rect x="405.8" y="52" width="138.9" height="12" fill="#a371f7"/>
  <rect x="544.8" y="52" width="73.5" height="12" fill="#3fb950"/>
  <rect x="618.2" y="52" width="46.4" height="12" fill="#d29922"/>
  <rect x="664.7" y="52" width="36.6" height="12" fill="#f85149"/>
  <circle cx="26" cy="88" r="5" fill="#58a6ff"/>
  <text class="text" x="40" y="92">Python</text>
